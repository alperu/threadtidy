name: Release

# Build, Developer-ID-sign, notarize, staple, and publish ThreadTidy.zip
# to a GitHub Release whenever a version tag (e.g. v0.1.0) is pushed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12_BASE64  base64 of the exported Developer ID
#                                 Application cert (.p12, key included)
#   MACOS_CERTIFICATE_PASSWORD    password set when exporting the .p12
#   KEYCHAIN_PASSWORD             throwaway password for the temp keychain
#   SIGN_IDENTITY                 e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                      Apple ID email used for notarization
#   APPLE_TEAM_ID                 10-character Team ID
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password from appleid.apple.com
#
# See docs/SIGNING_AND_NOTARIZATION.md for how to produce each secret.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to upload assets to the GitHub Release

jobs:
  release:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            src/ThreadTidy/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('src/ThreadTidy/Package.resolved', 'src/ThreadTidy/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          # Decode the cert from the secret.
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Create and unlock a dedicated temporary keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert + private key, allowing codesign to use it.
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Let codesign access the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put the temp keychain on the search list (keep the login one too).
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/[\" ]//g')

          rm -f "$CERT_PATH"

      - name: Store notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "ThreadTidy-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, notarize, staple
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: ThreadTidy-notary
        run: |
          set -euo pipefail
          # SwiftPM fetches the MLX dependencies from the network here —
          # that's expected. --no-bump leaves the tracked BUILD_NUMBER alone
          # since the git tag is the version of record.
          ./script/build-app.sh --notarize --no-bump

      - name: Stage release asset
        run: |
          set -euo pipefail
          ASSET="ThreadTidy-${GITHUB_REF_NAME}.zip"
          # build/ThreadTidy.zip is a symlink → builds/<tag>/ThreadTidy.zip;
          # cp resolves it to a real file with the release-named filename.
          cp "build/ThreadTidy.zip" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
